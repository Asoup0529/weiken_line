
name: Deploy LINE Ordering Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build website
        env:
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID }}
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID }}

          VITE_APPWRITE_CATEGORIES_COLLECTION_ID: ${{ vars.VITE_APPWRITE_CATEGORIES_COLLECTION_ID }}
          VITE_APPWRITE_PRODUCTS_COLLECTION_ID: ${{ vars.VITE_APPWRITE_PRODUCTS_COLLECTION_ID }}
          VITE_APPWRITE_ORDERS_COLLECTION_ID: ${{ vars.VITE_APPWRITE_ORDERS_COLLECTION_ID }}

          VITE_APPWRITE_CREATE_ORDER_FUNCTION_ID: ${{ vars.VITE_APPWRITE_CREATE_ORDER_FUNCTION_ID }}
          VITE_APPWRITE_ADMIN_API_FUNCTION_ID: ${{ vars.VITE_APPWRITE_ADMIN_API_FUNCTION_ID }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
